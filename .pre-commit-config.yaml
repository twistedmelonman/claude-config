# Repo-local pre-commit config for claude-config.
#
# WHY THIS FILE IS NOT EMPTY (it was `repos: []` until 2026-08-26):
#   The previous version disabled every hook, reasoning that "none of those
#   formatters apply to this repo's bash scripts". That was wrong: the global
#   config's shell-lint-fix hook (shellcheck + shfmt via lint-shell.sh) applies
#   directly, and this repo is almost entirely bash. The net effect was that the
#   repo hosting the review tooling ran no automatic shellcheck at all, while its
#   own AI reviewer filed issues for defects (missing traps, `local` misuse,
#   quoting) that shellcheck catches deterministically and for free.
#
# WHY IT IS STILL LOCAL RATHER THAN DELETED:
#   The global config also runs black, flake8, prettier and yamllint. Those are
#   not wanted here. A local config is how this repo opts into the hooks it
#   does want.
#
# WHY MARKDOWNLINT WAS ADDED BACK (2026-09-10):
#   Excluding it made this repo the fleet's worst standards-check offender:
#   6 of 10 runs failed, every one of them on markdownlint, while CI lints
#   Markdown whether or not the local config does. The opt-out did not remove
#   the standard — it removed the only chance to satisfy it before pushing.
#
#   The same reasoning as the shell hook above applies: a linter that runs in
#   CI and not locally converts a deterministic, auto-fixable finding into a
#   failed PR. `markdownlint --fix` repairs the three rules responsible for
#   nearly all of those failures (MD031, MD032, MD049) with no semantic change.
#
# ON THE index.lock CONFLICT the old comment described:
#   The failure is real but is NOT caused by running hooks during a commit.
#   `pre-commit run` uses a staged_files_only context manager that calls
#   `git write-tree`; that fails only when something else already holds
#   .git/index.lock. Verified 2026-08-26 in a scratch repo: the stash/restore
#   path runs cleanly with unstaged changes present, and reproduces the
#   "fatal: Unable to create ... index.lock: File exists" error only when a
#   lock file is held artificially. Re-enabling this hook does not reintroduce it.
#
# The AI code review (run-review.sh) runs as a separate step in the same git
# pre-commit hook and is unaffected by this config.

repos:
  # Shell linting and formatting, via the same global script the fleet uses.
  # Kept byte-identical to the global config's hook definition
  # (dotfiles/pre-commit/config.yaml) apart from the exclude below, so the two
  # cannot drift in behaviour.
  - repo: local
    hooks:
      - id: shell-lint-fix
        name: Shell Scripts Lint & Auto-Fix with Summary
        entry: bash -c '$HOME/.config/git/hooks/lint-shell.sh "$@"' --
        language: system
        types: [shell]
        pass_filenames: true
        verbose: true
        # tests/*.bats are tagged `shell` but are bats, not bash. bats injects
        # BATS_TEST_DIRNAME, BATS_TMPDIR and friends at runtime, so shellcheck
        # reports them as SC2154 "referenced but not assigned" — false positives
        # on every bats file. The bats suites are the tests; they are exercised by
        # running them, not by linting them as plain shell.
        #
        # A second exclusion for scripts/hook-check-commit-message.sh was removed
        # when that file was renamed to .py (its real language). `identify` now
        # tags it `python`, so `types: [shell]` skips it on its own and no
        # exclusion is needed.
        exclude: ^.*\.bats$

  # Markdown linting, byte-identical to the global config's hook definition
  # (dotfiles/pre-commit/config.yaml) so the two cannot drift in behaviour.
  #
  # The repo-local-config probe in the entry is inert here — this repo has no
  # .markdownlint.* at its root, so the else branch (the personal global
  # config) is what runs. It is kept rather than simplified precisely to
  # preserve byte-identity with global.
  - repo: local
    hooks:
      - id: markdownlint
        name: "Markdown Lint (fix)"
        entry: >-
          bash -c 'has_local_config=0;
          for f in .markdownlint.json .markdownlint.yaml .markdownlint.yml
          .markdownlint.jsonc .markdownlintrc; do
          [[ -f "$f" ]] && { has_local_config=1; break; }; done;
          if [[ "$has_local_config" -eq 1 ]]; then
          markdownlint --fix "$@";
          else
          markdownlint --fix --config "$HOME/.config/markdownlint-cli/.markdownlint.json" "$@";
          fi' --
        language: system
        types: [markdown]
        pass_filenames: true
        verbose: true
